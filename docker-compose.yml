services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set in .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:13.7.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE must be set in .env}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 60
    volumes:
      - ./flyway/sql:/flyway/sql:ro
    command: migrate

  wiremock:
    image: wiremock/wiremock:3.13.2
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - '8080:8080'
    volumes:
      - ./wiremock:/home/wiremock:ro

volumes:
  mysql_data:
